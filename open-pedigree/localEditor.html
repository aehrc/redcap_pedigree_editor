<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Open Pedigree by PhenoTips&reg;</title>
    <link rel="icon" type="image/png" href="dist/assets/open-pedigree-icon.png">

    <!-- Open Pedigree bundle -->
    <script type="text/javascript" src="dist/pedigree.min.js"></script>

    <!--
      redcap_pedigree_editor-specific addition (see pedigree-repeating-instrument-import
      OpenSpec change) - not part of the upstream open-pedigree-upgrade file this is
      otherwise copied from verbatim. Preserve this block across future re-syncs.
    -->
    <script type="text/javascript" src="../js/RedcapInstrumentPatientProvider.js"></script>

  </head>

  <body id='body'>
  <script type="text/javascript">

    function getParameterByName(name, url) {
      if (!url) url = window.location.href;
      name = name.replace(/[\[\]]/g, '\\$&');
      var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
              results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    var editor;

    document.addEventListener('DOMContentLoaded', function() {

      const mode = getParameterByName('mode');

      const disorderSystem = (mode === 'SCT') ? 'http://snomed.info/sct' :
              (mode === 'CUSTOM') ? getParameterByName('disorderSystem') : 'http://www.omim.org';
      const disorderValueset = (mode === 'SCT') ? 'http://snomed.info/sct?fhir_vs=refset/32570581000036105' :
              (mode === 'CUSTOM') ? getParameterByName('disorderValueset') : 'http://www.omim.org/vs';
      const disorderRegex = (mode === 'SCT') ? /\d+/ :
              (mode === 'CUSTOM') ? new RegExp(getParameterByName('disorderRegex')) : /\d+/;

      const phenotypeSystem = (mode === 'SCT') ? 'http://snomed.info/sct' :
              (mode === 'CUSTOM') ? getParameterByName('phenotypeSystem') : 'http://purl.obolibrary.org/obo/hp.owl';
      const phenotypeValueset = (mode === 'SCT') ? 'http://ga4gh.org/fhir/ValueSet/phenotype' :
              (mode === 'CUSTOM') ? getParameterByName('phenotypeValueset') : 'http://purl.obolibrary.org/obo/hp.owl?vs';
      const phenotypeRegex = (mode === 'SCT') ? /\d+/ :
              (mode === 'CUSTOM') ? new RegExp(getParameterByName('phenotypeRegex')) : /^(http:\/\/)|(HP:)/;
      const geneSystem = (mode === 'CUSTOM') ? getParameterByName('geneSystem') : 'http://purl.bioontology.org/ontology/HGNC/hgnc.owl';
      const geneValueset = (mode === 'CUSTOM') ? getParameterByName('geneValueset') : 'http://www.genenames.org';
      const geneRegex = (mode === 'CUSTOM') ? new RegExp(getParameterByName('geneRegex')) :  /\d+/;

      var redcapTerminolgyUrl = getParameterByName('redcapTerminolgyUrl');

      const processLookupFn = function (id, response) {
        const parsed = JSON.parse(response.responseText);
        if (parsed.parameter) {
          for (let i = 0; i < parsed.parameter.length; i++) {
            if (parsed.parameter[i].name === 'display') {
              return parsed.parameter[i].valueString;
            }
          }
        }
        throw 'Failed to find result in response';
      };
      const processSearchFn = function (search, response) {
        const result = [];
        if (response && response.responseText) {
          const parsed = JSON.parse(response.responseText);

          if (parsed.expansion && parsed.expansion.contains) {
            for (const v of parsed.expansion.contains) {
              result.push({'text': v.display, 'value': v.code});
            }
          }
        }
        return result;
      };

      // GET, not POST: TerminologyService.php's lookup/query actions only
      // read data, never write, and REDCap only requires a
      // redcap_csrf_token for POST requests to module pages - staying
      // GET-only means this never needs a CSRF token handed to the client
      // at all (which would otherwise end up in server access logs and
      // browser history via the URL), and lets TerminologyService leave
      // config.json's no-auth-pages (REDCap authenticates the session for
      // this page like any other module page).
      const buildTerminologyUrl = (params) =>
        redcapTerminolgyUrl + (redcapTerminolgyUrl.indexOf('?') >= 0 ? '&' : '?') + new URLSearchParams(params).toString();

      let terminologyOptions;
      if (redcapTerminolgyUrl){
        terminologyOptions = {
          'disorderOptions': {
            'type': 'Delegating',
            'lookupUrlFn':  (id) => buildTerminologyUrl({type: 'lookup', system: disorderSystem, code: id}),
            'processLookupResponseFn': processLookupFn,
            'lookupAjaxOptionsFn':  (id) => ({ method: 'GET' }),
            'searchUrlFn': (search) => buildTerminologyUrl({ type: 'query', url: disorderValueset, filter: search, count: 20 }),
            'processSearchResponseFn': processSearchFn,
            'searchAjaxOptionsFn':  (search) => ({ method: 'GET' })
          },
          phenotypeOptions: {
            'type': 'Delegating',
            'lookupUrlFn':  (id) => buildTerminologyUrl({type: 'lookup', system: phenotypeSystem, code: id}),
            'processLookupResponseFn': processLookupFn,
            'lookupAjaxOptionsFn':  (id) => ({ method: 'GET' }),
            'searchUrlFn': (search) => buildTerminologyUrl({ type: 'query', url: phenotypeValueset, filter: search, count: 20 }),
            'processSearchResponseFn': processSearchFn,
            'searchAjaxOptionsFn':  (search) => ({ method: 'GET' })
          },
          'geneOptions': {
            'type': 'Delegating',
            'lookupUrlFn':  (id) => buildTerminologyUrl({type: 'lookup', system: geneSystem, code: id}),
            'processLookupResponseFn': processLookupFn,
            'lookupAjaxOptionsFn':  (id) => ({ method: 'GET' }),
            'searchUrlFn': (search) => buildTerminologyUrl({ type: 'query', url: geneValueset, filter: search, count: 20 }),
            'processSearchResponseFn': processSearchFn,
            'searchAjaxOptionsFn':  (search) => ({ method: 'GET' })
          },
          'fhirTerminologyHelperOptions': {
            'disorderCodeSystem': disorderSystem,
            'phenotypeCodeSystem': phenotypeSystem,
            'geneCodeSystem': geneSystem
          }
        };
      }
      else {
        var ontologyServer = getParameterByName('ontologyServer') || 'https://tx.ontoserver.csiro.au/fhir/';

        terminologyOptions = {
          'disorderOptions': {
            'type': 'FHIR',
            'codeSystem': disorderSystem,
            'validIdRegex': disorderRegex,
            'fhirBaseUrl': ontologyServer,
            'valueSet': disorderValueset
          },
          'phenotypeOptions': {
            'type': 'FHIR',
            'codeSystem': phenotypeSystem,
            'validIdRegex': phenotypeRegex,
            'fhirBaseUrl': ontologyServer,
            'valueSet': phenotypeValueset
          },
          'geneOptions': {
            'type': 'FHIR',
            'codeSystem': geneSystem,
            'validIdRegex': geneRegex,
            'fhirBaseUrl': ontologyServer,
            'valueSet': geneValueset
          },
          'fhirTerminologyHelperOptions': {
            'disorderCodeSystem': disorderSystem,
            'phenotypeCodeSystem': phenotypeSystem,
            'geneCodeSystem': geneSystem
          }
        };
      }

      var qData = getParameterByName('qData');

      var format = getParameterByName('format') || 'fhir';
      if (format === ''){
        format = 'fhir';
      }

      console.log("creating editor");

      // redcap_pedigree_editor-specific addition (see pedigree-repeating-instrument-import
      // and pedigree-editor-redcap-extension-extraction OpenSpec changes) - not part of
      // the upstream file this is otherwise copied from verbatim. Preserve this block
      // across future re-syncs.
      var pedigreeImportEndpoint = getParameterByName('pedigreeImportEndpoint');
      var recordLinkProviderOptions = {};
      if (pedigreeImportEndpoint && window.RedcapInstrumentPatientProvider) {
        recordLinkProviderOptions = {
          recordLinkProvider: new RedcapInstrumentPatientProvider({
            endpoint: pedigreeImportEndpoint,
            configured: true
          })
        };
      }

      var pedigreeQuestionnaireUrl = getParameterByName('pedigreeQuestionnaireUrl');
      var questionnaireOptions = pedigreeQuestionnaireUrl ? { questionnaireUrl: pedigreeQuestionnaireUrl } : {};

      var editorOptions = {
        // patientDataUrl: 'local:pedigreeData?format='+format+'&closeOnSave=true' + (qData?('&qData='+qData):''),
        patientDataUrl: 'local:pedigreeData?format='+format+'&closeOnSave=true',
        returnUrl: '#CloseWindow',
        backend: OpenPedigree.localStorageBackend,
        ...terminologyOptions,
        ...recordLinkProviderOptions,
        ...questionnaireOptions};


      editor = OpenPedigree.initialiseEditor(editorOptions);

    });
  </script>
  </body>
</html>
