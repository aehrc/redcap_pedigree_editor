name: security-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  psalm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: composer install --no-interaction --no-progress

      # Psalm 7's --taint-analysis also runs the ordinary analysis, and its exit code counts those
      # issues too (unused methods, REDCap globals it can't see...), which errorLevel 8 isn't meant
      # to gate. So the exit code isn't used: the gate is the taint findings in its report.
      - name: Run Psalm taint analysis
        run: vendor/bin/psalm --taint-analysis --no-progress --report=psalm-results.sarif || true

      # What the gate is for, from the report: taint findings at error level (psalm.xml pins the
      # categories mirroring the REDCap consortium's scan to error), and ParseError - a file Psalm
      # can't parse is a file it can't check for taint. No report means Psalm itself failed.
      - name: Keep only the findings the gate is for
        run: |
          test -s psalm-results.sarif || { echo "::error::Psalm wrote no report"; exit 1; }
          jq '.runs |= map((.tool.driver.rules // [] | map(select(.name | startswith("Tainted") or . == "ParseError") | .id)) as $gated
                | .results |= map(select(.level == "error" and (.ruleId as $id | $gated | index($id)))))' \
            psalm-results.sarif > psalm-taint.sarif

      # continue-on-error: GITHUB_TOKEN is forced read-only on pull_request runs triggered from
      # forks, regardless of the security-events: write permission declared above, so this step
      # would fail on any fork PR for a reason unrelated to Psalm's actual findings.
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: psalm-taint.sarif
        continue-on-error: true

      - name: Fail the job if Psalm found taint issues
        run: |
          # (workflow-command escaping: % and newlines in the message, and , : too in properties)
          jq -r 'def msg: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                 def prop: msg | gsub(":"; "%3A") | gsub(","; "%2C");
            .runs[] | (.tool.driver.rules // [] | map({key: .id, value: .name}) | from_entries) as $names
            | .results[] | .locations[0].physicalLocation as $at
            | "::error file=\($at.artifactLocation.uri | prop),line=\($at.region.startLine)::\(($names[.ruleId] // .ruleId) + ": " + .message.text | msg)"' psalm-taint.sarif
          count=$(jq '[.runs[].results[]] | length' psalm-taint.sarif)
          echo "$count finding(s) the gate is for"
          test "$count" -eq 0
